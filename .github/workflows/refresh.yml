# Keeps data, picks and results current without needing your computer or the Claude app.
# Game days: every 2 hours from 10am to 8pm US Central (more often near tip-off, when lineups and injury news land),
# plus a morning run that scores last night's games. All times are UTC (Central standard time = UTC-6).
# Setup: put this folder in a GitHub repo, then Settings > Actions > General > Workflow permissions > "Read and write".
name: refresh
on:
  schedule:
    - cron: '30 13 * * *'
    - cron: '0 16,18,20,22,0,2 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node refresh.js
      - name: Commit changes
        run: |
          git config user.name "sportssim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js picks-log.json picks-results.js college-cache.json
          git diff --cached --quiet || git commit -m "Refresh data and picks"
          git pull --rebase -q
          git push
