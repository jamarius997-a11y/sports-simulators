<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports Simulators</title>
<style>
  :root { --bg:#0f1218; --panel:#181d27; --line:#2a3242; --text:#e8ecf3; --muted:#8b96ab; --accent:#4f9dff; --good:#3ecf8e; --bad:#ff6b6b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6fa; --panel:#fff; --line:#d8dee9; --text:#1a2030; --muted:#5d6878; --accent:#1f6feb; --good:#12945b; --bad:#d63b3b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab { flex:1; padding:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:8px; font-weight:600; cursor:pointer; }
  .tab.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .matchup { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px) { .matchup { grid-template-columns:1fr; } }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  select, input { width:100%; padding:7px 8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; }
  .side h3 { margin:0 0 4px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .btns { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
  .btns > div { min-width:110px; }
  button.act { padding:9px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button.alt { background:transparent; color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:5px 8px; text-align:right; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  .score { display:flex; justify-content:space-around; align-items:center; font-size:34px; font-weight:700; margin:6px 0 12px; }
  .score small { display:block; font-size:12px; color:var(--muted); font-weight:500; }
  .win { color:var(--good); }
  .log { max-height:280px; overflow:auto; font-size:13px; color:var(--muted); border-top:1px solid var(--line); padding-top:8px; margin-top:10px; }
  .log div { padding:2px 0; }
  .bar { display:flex; align-items:center; gap:8px; font-size:12px; }
  .bar i { display:block; height:12px; background:var(--accent); border-radius:2px; min-width:1px; }
  .bar span:first-child { width:48px; text-align:right; color:var(--muted); }
  .winbar { display:flex; height:26px; border-radius:6px; overflow:hidden; margin:8px 0; font-size:13px; font-weight:600; color:#fff; }
  .winbar div { display:flex; align-items:center; justify-content:center; }
  details { margin-top:10px; font-size:13px; } summary { cursor:pointer; color:var(--accent); }
  .rost td, .rost th { padding:3px 4px; } .rost input { padding:3px 5px; font-size:12px; } .rost input[type=number] { width:64px; }
  .up td, .up th { font-size:13px; } .up button { padding:3px 8px; font-size:12px; } .pos { color:var(--good); } .neg { color:var(--bad); }
  .note { font-size:13px; color:var(--muted); }
  .muted { color:var(--muted); font-weight:400; font-size:13px; }
  h1 { font-size:24px; letter-spacing:-.01em; }
  h2 { font-size:19px; margin:0; }
  .tab { font-size:16px; padding:12px; }
  .panel > summary, details.fold > summary, details.tool > summary { cursor:pointer; font-weight:600; font-size:16px; list-style:none; color:var(--text); }
  details.fold > summary::before, details.tool > summary::before { content:'\25B8'; display:inline-block; width:1.1em; color:var(--accent); }
  details.fold[open] > summary::before, details.tool[open] > summary::before { content:'\25BE'; }
  details.fold[open] > summary, details.tool[open] > summary { margin-bottom:10px; }
  .board-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:4px; }
  h3.day { margin:18px 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .game { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:var(--bg); }
  .game.gap { border-color:var(--bad); box-shadow:inset 4px 0 0 var(--bad); }
  .g-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .g-top .when { font-weight:600; color:var(--muted); font-size:14px; }
  .g-top button { margin-left:auto; padding:5px 10px; font-size:13px; }
  .chip { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .g-teams { font-size:22px; font-weight:700; margin:2px 0 6px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .g-teams .at { color:var(--muted); font-weight:400; font-size:16px; }
  .g-teams .mline { margin-left:auto; font-size:13px; font-weight:400; color:var(--muted); }
  table.cmp { font-size:15px; margin:4px 0; }
  table.cmp th { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); text-align:left; border-bottom:1px solid var(--line); }
  table.cmp td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.cmp td:first-child, table.cmp th:first-child { color:var(--muted); width:34%; padding-left:0; }
  table.cmp tr.best td { background:rgba(79,157,255,.10); }
  .verdict { margin:8px 0 2px; font-size:15px; }
  .game.gap .verdict { color:var(--bad); }
  .inj, .goal { margin-top:8px; font-size:13px; color:var(--muted); line-height:1.5; }
  .inj .lbl, .goal .lbl { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:1px; }
  .inj b, .goal b { color:var(--text); }
  .st-out { color:var(--bad); } .st-q { color:#d9a441; }
  details.how { margin:2px 0 6px; }
  @media (max-width:560px) { .wrap { padding:12px; } .g-teams { font-size:20px; } table.cmp td:first-child, table.cmp th:first-child { width:30%; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sports Simulators</h1>
  <p class="note" id="liveNote" style="margin:-6px 0 10px"></p>
  <div class="tabs" id="tabs"></div>

  <div class="panel" id="upcoming"></div>

  <details class="panel tool" id="tool"><summary>Simulator: pick any two teams and run a game, series or season</summary>
    <div class="matchup">
      <div class="side"><h3>Away</h3><select id="awaySel"></select><div id="awayFields"></div><details><summary>Roster</summary><div id="awayRoster"></div></details></div>
      <div class="side"><h3>Home</h3><select id="homeSel"></select><div id="homeFields"></div><details><summary>Roster</summary><div id="homeRoster"></div></details></div>
    </div>
    <div class="btns" style="margin-top:14px">
      <div><label>Seed (blank = random)</label><input id="seed" placeholder="e.g. 42"></div>
      <button class="act" id="bGame">Sim game</button>
      <div><label>Games</label><select id="nGames"><option>1000</option><option selected>5000</option><option>20000</option></select></div>
      <button class="act alt" id="bMC">Monte Carlo</button>
      <div><label>Series</label><select id="bestOf"><option value="1">Single game</option><option value="3">Best of 3</option><option value="5">Best of 5</option><option value="7" selected>Best of 7</option></select></div>
      <button class="act alt" id="bSeries">Sim series</button>
      <button class="act alt" id="bLeague">League table</button>
    </div>
    <p class="note" style="margin-bottom:0">Team ratings are rough approximations, not live data &mdash; edit them above. Series: Away team is the lower seed, Home team has home-court/ice/field advantage.</p>
  </details>

  <div id="out"></div>

  <details class="panel fold" id="picks"></details>

  <details class="panel fold" id="backtest"></details>
</div>
<script src="sim.js"></script>
<script src="travel.js"></script>
<script src="data.js" onerror="void 0"></script>
<script src="backtest-results.js" onerror="void 0"></script>
<script src="picks-results.js" onerror="void 0"></script>
<script>
const $ = id => document.getElementById(id);
let sport = 'nba';
const S = Sim.SPORTS;

function rng() { const v = $('seed').value.trim(); return Sim.makeRng(v === '' ? (Math.random() * 4294967296) >>> 0 : (parseInt(v, 10) || 1)); }
function team(sel) { return S[sport].teams[+sel.value]; }
function fmt(x) { return Number.isInteger(x) ? x : x.toFixed(1); }

function buildTabs() {
  $('tabs').innerHTML = '';
  for (const k in S) {
    if (k === 'mlb') continue;   // hidden: no live MLB data and it is the offseason (engine kept in sim.js)
    const b = document.createElement('button');
    b.className = 'tab' + (k === sport ? ' on' : ''); b.textContent = S[k].label;
    b.onclick = () => { sport = k; buildTabs(); buildTeams(); $('out').innerHTML = ''; renderUpcoming(); renderPicks(); renderBacktest(); };
    $('tabs').appendChild(b);
  }
}
function buildFields(side) {
  const t = team($(side + 'Sel'));
  $(side + 'Fields').innerHTML = S[sport].fields.map(f =>
    `<label>${f[1]}</label><input type="number" step="${f[2]}" data-k="${f[0]}" value="${+(+t[f[0]]).toFixed(3)}">`).join('');
  $(side + 'Fields').querySelectorAll('input').forEach(inp => inp.onchange = () => { const v = parseFloat(inp.value); if (!isNaN(v)) t[inp.dataset.k] = v; });
}
function buildTeams() {
  const opts = S[sport].teams.map((t, i) => `<option value="${i}">${t.name}</option>`).join('');
  $('awaySel').innerHTML = opts; $('homeSel').innerHTML = opts;
  $('awaySel').value = 1; $('homeSel').value = 0;
  buildFields('away'); buildFields('home'); buildRoster('away'); buildRoster('home');
}
$('awaySel').onchange = () => { curRest = null; curWx = null; buildFields('away'); buildRoster('away'); };
$('homeSel').onchange = () => { curRest = null; curWx = null; buildFields('home'); buildRoster('home'); };

// Roster editor: rename players, mark injured players Out, tweak the rating that drives their share of the action.
function buildRoster(side) {
  const t = team($(side + 'Sel')), R = Sim.roster(sport, t);
  const G = {
    nba: [['Rotation', R.players, 'min', 'Min'], ['', null]],
    mlb: [['Lineup', R.lineup, 'bat', 'Bat']],
    nfl: [['QB', R.qb, 'ypa', 'Y/A'], ['RB', R.rb, 'car', 'Car'], ['WR / TE', R.rec, 'tgt', 'Tgt'], ['O-line', R.ol && R.ol.length ? R.ol : null, 'snap', 'Snap%'], ['Defense', R.defense, R.defense && R.defense.some(p => p.snap != null) ? 'snap' : 'prod', R.defense && R.defense.some(p => p.snap != null) ? 'Snap%' : 'Prod']],
    nhl: [['Forwards', R.fwd, 'w', 'Shot wt'], ['Defense', R.def, 'w', 'Shot wt']],
  }[sport].filter(g => g[1]);
  const hasOut = sport !== 'mlb';
  let html = (t.live ? '<p class="note">Live ratings and rosters (' + (t.liveGp || 0) + ' games this season, blended with last season). Tick <b>Out</b> to sit a player.</p>' : '<p class="note">Names are generated placeholders &mdash; rename them and adjust ratings.</p>');
  if (sport === 'mlb') {
    html += '<label>Starting pitcher</label><select data-start>' + '<option value="-1">Random from rotation</option>' +
      R.rotation.map((p, i) => '<option value="' + i + '"' + (t.startIdx === i ? ' selected' : '') + '>' + p.name + ' (' + (p.adj > 0 ? '+' : '') + p.adj + ' RA)</option>').join('') + '</select>';
  }
  if (sport === 'nhl' && R.goalies) {
    html += '<label>Starting goalie</label><select data-goalie>' + R.goalies.map((g, i) => '<option value="' + i + '"' + ((t.gIdx != null && t.gIdx >= 0 ? t.gIdx : R.goalies.findIndex(x => !x.out)) === i ? ' selected' : '') + '>' + g.name + ' (' + g.sv.toFixed(3) + ' SV%, ' + Math.round(g.gp) + ' GP)' + (g.out ? ' – OUT' : '') + '</option>').join('') + '</select>';
  }
  const fmtv = v => (typeof v === 'number' ? Math.round(v * 100) / 100 : v);
  html += '<table class="rost">';
  G.forEach((g, gi) => {
    html += '<tr><th>' + g[0] + '</th><th>Pos</th><th>' + g[3] + '</th>' + (hasOut ? '<th>Out</th>' : '') + '</tr>';
    g[1].forEach((p, pi) => {
      html += '<tr><td><input data-g="' + gi + '" data-p="' + pi + '" data-name value="' + p.name.replace(/"/g, '&quot;') + '"></td><td>' + p.pos + '</td>' +
        '<td><input type="number" step="any" data-g="' + gi + '" data-p="' + pi + '" data-num value="' + fmtv(p[g[2]]) + '"></td>' +
        (hasOut ? '<td title="' + (p.note || '') + '"><input type="checkbox" data-g="' + gi + '" data-p="' + pi + '" data-out' + (p.out ? ' checked' : '') + '>' + (p.note ? ' <span class="note">' + p.note + '</span>' : '') + '</td>' : '') + '</tr>';
    });
  });
  html += '</table>';
  if (sport === 'mlb') html += '<label>Rotation (RA adjustment per game; negative = better)</label><table class="rost">' + R.rotation.map((p, i) => '<tr><td><input data-rot="' + i + '" data-name value="' + p.name + '"></td><td></td><td><input type="number" step="0.05" data-rot="' + i + '" data-adj value="' + p.adj + '"></td></tr>').join('') + '</table>';
  const box = $(side + 'Roster'); box.innerHTML = html;
  box.querySelectorAll('input').forEach(inp => inp.onchange = () => {
    const isRot = inp.dataset.rot != null;
    const tgt = isRot ? R.rotation[+inp.dataset.rot] : G[+inp.dataset.g][1][+inp.dataset.p];
    if (inp.hasAttribute('data-out')) tgt.out = inp.checked;
    else if (inp.hasAttribute('data-name')) tgt.name = inp.value || tgt.name;
    else { const v = parseFloat(inp.value); if (!isNaN(v)) tgt[inp.hasAttribute('data-adj') ? 'adj' : G[+inp.dataset.g][2]] = v; }
  });
  const sel = box.querySelector('[data-start]'); if (sel) sel.onchange = () => { t.startIdx = +sel.value; };
  const gs = box.querySelector('[data-goalie]'); if (gs) gs.onchange = () => { t.gIdx = +gs.value; };
}

function matchup() {
  const a = team($('awaySel')), h = team($('homeSel'));
  if (a === h) { $('out').innerHTML = '<div class="panel">Pick two different teams.</div>'; return null; }
  return [a, h];
}

$('bGame').onclick = () => {
  const m = matchup(); if (!m) return;
  const g = Sim.simGame(sport, m[0], m[1], rng(), { detail: true, rest: curRest, weather: curWx });
  const w = g.winner;
  $('out').innerHTML = `<div class="panel">
    <div class="score">
      <div class="${w === 0 && !g.tie ? 'win' : ''}">${g.teams[0].id}<br>${g.score[0]}<small>${g.teams[0].name}</small></div>
      <div style="font-size:14px;color:var(--muted)">${g.tie ? 'Final/OT – tie' : g.extra ? 'Final/' + g.extraLabel.replace('F/', '') : 'Final'}</div>
      <div class="${w === 1 && !g.tie ? 'win' : ''}">${g.teams[1].id}<br>${g.score[1]}<small>${g.teams[1].name}</small></div>
    </div>
    <table><tr><th></th>${g.line.headers.map(h => `<th>${h}</th>`).join('')}</tr>
      ${[0, 1].map(i => `<tr><td>${g.teams[i].id}</td>${g.line.rows[i].map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}
    </table>
    <table style="margin-top:12px"><tr><th>${g.teams[0].id}</th><th></th><th>${g.teams[1].id}</th></tr>
      ${g.box.map(r => `<tr><td>${r[1]}</td><td style="text-align:center;color:var(--muted)">${r[0]}</td><td>${r[2]}</td></tr>`).join('')}
    </table>
    ${[0, 1].map(i => g.tables[i].map(tb => `<h4 style="margin:14px 0 4px">${g.teams[i].name} &mdash; ${tb.title}</h4><table><tr>${tb.headers.map(x => `<th>${x}</th>`).join('')}</tr>${tb.rows.map(r => `<tr>${r.map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}</table>`).join('')).join('')}
    <div class="log">${g.log.map(l => `<div>${l}</div>`).join('')}</div></div>`;
};

$('bMC').onclick = () => {
  const m = matchup(); if (!m) return;
  const n = +$('nGames').value, r = Sim.monteCarlo(sport, m[0], m[1], n, rng(), { rest: curRest, weather: curWx });
  const pa = r.wins[0] / n * 100, ph = r.wins[1] / n * 100, pt = r.wins[2] / n * 100;
  let rows = '', peak = 0;
  for (const v of r.margins.values()) peak = Math.max(peak, v);
  const keys = [...r.margins.keys()].sort((a, b) => a - b);
  const lo = Math.max(keys[0], -40 * r.bin), hi = Math.min(keys[keys.length - 1], 40 * r.bin);
  for (let k = lo; k <= hi; k += r.bin) {
    const v = r.margins.get(k) || 0;
    rows += `<div class="bar"><span>${k > 0 ? '+' : ''}${k}</span><i style="width:${v / peak * 70}%"></i><span>${(v / n * 100).toFixed(1)}%</span></div>`;
  }
  $('out').innerHTML = `<div class="panel"><b>${n.toLocaleString()} simulated games</b> &mdash; ${m[0].name} @ ${m[1].name}
    <div class="winbar"><div style="width:${pa}%;background:#c0692b">${m[0].id} ${pa.toFixed(1)}%</div>${pt > 0 ? `<div style="width:${pt}%;background:var(--muted)" title="ties">${pt >= 4 ? 'T ' + pt.toFixed(1) + '%' : ''}</div>` : ''}<div style="width:${ph}%;background:var(--accent)">${m[1].id} ${ph.toFixed(1)}%</div></div>
    <table><tr><th></th><th>Avg score</th></tr>
      <tr><td>${m[0].id}</td><td>${r.avg[0].toFixed(2)}</td></tr><tr><td>${m[1].id}</td><td>${r.avg[1].toFixed(2)}</td></tr>
      <tr><td>Avg total</td><td>${r.avgTotal.toFixed(2)}</td></tr><tr><td>Extra time / innings</td><td>${(r.extraPct * 100).toFixed(1)}%</td></tr></table>
    <h4 style="margin:14px 0 6px">Margin distribution (${m[1].id} minus ${m[0].id})</h4>${rows}</div>`;
};

$('bSeries').onclick = () => {
  const m = matchup(); if (!m) return;
  const bo = +$('bestOf').value, R = rng();
  const one = Sim.playSeries(sport, m[1], m[0], bo, R);
  const mc = Sim.seriesMonteCarlo(sport, m[1], m[0], bo, 2000, R);
  const hi = m[1], lo = m[0];
  $('out').innerHTML = `<div class="panel"><b>Best-of-${bo}: ${hi.name} (home) vs ${lo.name}</b>
    <p>One sample series: <b class="win">${[hi, lo][one.winner].name}</b> win ${Math.max(...one.wins)}&ndash;${Math.min(...one.wins)}</p>
    <table><tr><th>Game</th><th>Home</th><th>Score</th><th>Winner</th></tr>
    ${one.games.map((g, i) => `<tr><td>${i + 1}</td><td>${(g.hiHome ? hi : lo).id}</td><td>${g.hiScore}&ndash;${g.loScore} (${hi.id}&ndash;${lo.id})${g.extra ? ' ' + g.extra : ''}</td><td>${(g.hiWon ? hi : lo).id}</td></tr>`).join('')}</table>
    <h4 style="margin:14px 0 6px">2,000 simulated series</h4>
    <div class="winbar"><div style="width:${mc.wins[0] / 20}%;background:var(--accent)">${hi.id} ${(mc.wins[0] / 20).toFixed(1)}%</div><div style="width:${mc.wins[1] / 20}%;background:#c0692b">${lo.id} ${(mc.wins[1] / 20).toFixed(1)}%</div></div>
    ${Object.keys(mc.lengths).sort().map(k => `<div class="bar"><span>${k} gms</span><i style="width:${mc.lengths[k] / 2000 * 100 * 1.4}%"></i><span>${(mc.lengths[k] / 20).toFixed(1)}%</span></div>`).join('')}</div>`;
};

$('bLeague').onclick = () => {
  const out = $('out'); out.innerHTML = '<div class="panel">Simulating every team against every other team, home and away&hellip;</div>';
  setTimeout(() => {
    const reps = sport === 'mlb' ? 4 : 6, rows = Sim.leagueTable(sport, reps, rng());
    out.innerHTML = `<div class="panel"><b>League power table</b> <span class="note">(${reps} full home-and-away round robins, ${rows[0].gp} games each)</span>
    <table><tr><th>#&nbsp;Team</th><th>W</th><th>L</th><th>Win%</th><th>Avg PF</th><th>Avg PA</th></tr>
    ${rows.map((x, i) => `<tr><td>${i + 1}. ${x.team.name}</td><td>${x.w}</td><td>${x.l}</td><td>${x.pct.toFixed(3)}</td><td>${(x.pf / x.gp).toFixed(1)}</td><td>${(x.pa / x.gp).toFixed(1)}</td></tr>`).join('')}</table></div>`;
  }, 20);
};

const liveN = window.LIVE_DATA ? Sim.applyLive(window.LIVE_DATA) : 0;
$('liveNote').textContent = liveN
  ? 'Live ratings for ' + liveN + ' teams. Data: ESPN, nflverse and MoneyPuck.com (NHL, non-commercial use). Refreshes every 2 hours on game days.'
  : 'No live data loaded (data.js missing) — using built-in approximate ratings. Run: node update-data.js';
// ---------- Upcoming games ----------
const normName = x => x.toLowerCase().replace(/[^a-z]/g, '');
function findTeam(sp, side) { const T = S[sp].teams; return T.find(t => normName(t.name) === normName(side.name)) || T.find(t => t.id === side.abbr); }
function prepGame(g, sp) {   // sp: the sport being simulated (the visible tab can change mid-run)
  sp = sp || sport;
  const a = findTeam(sp, g.away), h = findTeam(sp, g.home); if (!a || !h) return null;
  if (sp === 'nhl') [[a, g.away], [h, g.home]].forEach(([t, s]) => {
